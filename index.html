<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Quest | charity: water</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="bg-decor">
    <div class="droplet d1"></div>
    <div class="droplet d2"></div>
    <div class="droplet d3"></div>
  </div>

  <div class="container">
    <img class="logo" src="img/cw_logo_horizontal.png" alt="charity: water logo" />

 <div class="how-to-play">
  <span class="hint">
    <img src="img/clean-removebg-preview.png" alt="Clean can" class="hint-icon">
    +1 point
  </span>
  <span class="hint">
    <img src="img/dirty-removebg-preview.png" alt="Dirty can" class="hint-icon">
    −1 point
  </span>
  <span class="how-to-text">Pick a difficulty, hit Start, and tap clean cans before time runs out!</span>
</div>
<p class="difficulty-label">Choose your difficulty</p>

<div class="difficulty-row" id="difficulty-row">
  <button class="diff-btn" data-difficulty="easy">Easy</button>
  <button class="diff-btn active" data-difficulty="normal">Normal</button>
  <button class="diff-btn" data-difficulty="hard">Hard</button>
</div>

    <div id="achievements" class="achievement"></div>

    <div class="game-grid"></div>

    <div class="button-row">
      <button id="start-game" class="btn btn-primary">Start Game</button>
      <button id="reset-game" class="btn btn-danger">Reset</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
