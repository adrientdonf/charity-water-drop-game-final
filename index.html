<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Quest | charity: water</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="bg-decor">
    <div class="droplet d1"></div>
    <div class="droplet d2"></div>
    <div class="droplet d3"></div>
  </div>

  <div class="container">
    <img class="logo" src="img/cw_logo_horizontal.png" alt="charity: water logo" />

    <h1>Water Quest</h1>
    <p class="game-instructions">Tap the clean water cans to collect points — avoid the dirty ones! Collect 20 to win.</p>

    <div class="stats">
      <div class="stat-card">
        <span class="stat-label">Cans Collected</span>
        <span class="stat-value" id="current-cans">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Time Left</span>
        <span class="stat-value"><span id="timer">30</span>s</span>
        <div class="timer-track">
          <div class="timer-fill" id="timer-fill"></div>
        </div>
      </div>
    </div>

    <div id="achievements" class="achievement"></div>

    <div class="game-grid"></div>

    <div class="button-row">
      <button id="start-game" class="btn btn-primary">Start Game</button>
      <button id="reset-game" class="btn btn-danger">Reset</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
